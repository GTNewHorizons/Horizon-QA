// Each supervised test runtime owns its game directory and a snapshot of this build's project outputs
// RFG derives --gameDir from workingDir and uses the JavaExec classpath

def launchProperties = gradle.startParameter.projectProperties
def launchReport = launchProperties['horizonQaClientReportDir'] ?: launchProperties['horizonQaServerReportDir']
if (launchReport) {
    def game = new File(launchReport, 'game').canonicalFile
    if (launchProperties['runDir'] && new File(launchProperties['runDir']).canonicalFile != game) {
        throw new GradleException('runDir must match the supervised game directory: ' + game)
    }
    // Make the directory available before plugins configure preparation and launch tasks
    gradle.beforeProject { project ->
        project.extensions.extraProperties.set('runDir', game.path)
    }
}

interface ClientIsolationServices {
    @javax.inject.Inject
    org.gradle.api.file.FileSystemOperations getFileSystemOperations()

    @javax.inject.Inject
    org.gradle.api.model.ObjectFactory getObjects()
}
gradle.projectsEvaluated {
    def properties = gradle.startParameter.projectProperties
    boolean client = properties.containsKey('horizonQaClientTask')
    def role = client ? 'Client' : 'Server'
    def requestedTask = properties["horizonQa${role}Task"]
    def reportPath = properties["horizonQa${role}ReportDir"]
    // Gradle also applies init scripts to included plugin builds, which have no client launch request
    if (!requestedTask && !reportPath) return
    if (!requestedTask || !reportPath) {
        throw new GradleException('Runtime isolation requires a task and report directory')
    }
    def taskPath = requestedTask.startsWith(':') ? requestedTask : ':' + requestedTask
    def clientTask = gradle.rootProject.tasks.getByPath(taskPath)
    if (!clientTask.hasProperty('cmdlineJvmArgs') || !clientTask.hasProperty('assetsDirectory')) {
        throw new GradleException('Client isolation requires an RFG RunMinecraftTask: ' + taskPath)
    }
    def gameDirectory = new File(reportPath, 'game').canonicalFile
    clientTask.workingDir = gameDirectory
    def runtimeMods = clientTask.extensions.findByName('runtimeMods')
    def modsFile = properties['horizonQaRuntimeModsFile']
    def requestedMods = modsFile ? new groovy.json.JsonSlurper().parse(clientTask.project.file(modsFile), 'UTF-8') : []
    if (runtimeMods != null) {
        if (requestedMods.isEmpty()) throw new GradleException('A production runtime requires --runtime-mod with a production HQA JAR')
        requestedMods.each { jarPath ->
            def jar = clientTask.project.file(jarPath)
            if (!jar.isFile() || !jar.name.endsWith('.jar') || jar.name.endsWith('-dev.jar')) {
                throw new GradleException('Expected a production mod JAR: ' + jar)
            }
            runtimeMods.from(jar)
        }
    } else if (!requestedMods.isEmpty()) {
        throw new GradleException('The selected task does not expose a runtimeMods file collection')
    }
    def buildRoots = gradle.rootProject.allprojects.collect {
        it.layout.buildDirectory.get().asFile.canonicalFile
    }
    def services = gradle.rootProject.objects.newInstance(ClientIsolationServices)
    clientTask.doFirst { task ->
        // Dependencies have finished. Resolve before replacing the collection so their build ordering is retained
        def snapshotRoot = new File(reportPath, 'classpath')
        java.nio.file.Files.createDirectories(snapshotRoot.parentFile.toPath())
        java.nio.file.Files.createDirectory(snapshotRoot.toPath())
        def originalClasspath = task.classpath.files.toList()
        def isolatedClasspath = []
        int copiedEntries = 0
        originalClasspath.eachWithIndex { source, index ->
            if (!buildRoots.any { source.canonicalFile.toPath().startsWith(it.toPath()) }) {
                isolatedClasspath.add(source)
                return
            }
            def snapshot = new File(snapshotRoot, index + '/' + source.name)
            copiedEntries++
            if (source.isDirectory()) {
                services.fileSystemOperations.copy {
                    from source
                    into snapshot
                }
            } else if (source.isFile()) {
                java.nio.file.Files.createDirectories(snapshot.parentFile.toPath())
                java.nio.file.Files.copy(source.toPath(), snapshot.toPath())
            }
            // Absent optional output directories remain absent even if a later build creates them
            isolatedClasspath.add(snapshot)
        }
        task.setClasspath(services.objects.fileCollection().from(isolatedClasspath))
        task.logger.lifecycle('Client classpath snapshot ready: {} project entries in {}', copiedEntries, snapshotRoot)
        task.workingDir = gameDirectory
        java.nio.file.Files.createDirectories(task.workingDir.toPath())
        if (client) {
            new File(task.workingDir, 'options.txt').setText(
                'soundCategory_master:0.5\nsoundCategory_music:0.0\nsoundCategory_weather:0.0\n', 'UTF-8')
        } else {
            if (properties['horizonQaAcceptEula'] != 'true')
                throw new GradleException('Server isolation requires explicit EULA acceptance')
            new File(task.workingDir, 'eula.txt').setText('eula=true\n', 'UTF-8')
            def serverFile = new File(task.workingDir, 'server.properties')
            def serverSettings = new Properties()
            if (serverFile.isFile()) serverFile.withInputStream { serverSettings.load(it) }
            serverSettings.setProperty('online-mode', 'false')
            serverFile.withOutputStream { serverSettings.store(it, null) }
        }
        // The supervisor can let another build prepare now that this launch owns its project outputs
        java.nio.file.Files.createFile(new File(reportPath, 'client-classpath-ready').toPath())
    }
}
